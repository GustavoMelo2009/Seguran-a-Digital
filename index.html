<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerador de senha</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <section class="conteudo">
        <div class="conteudo-titulo">
            <img src="unlock.svg" alt="cadeado fechado">
            <h2 class="titulo-principal">Gerador de senhas</h2>
            <h3 class="titulo-secundario">Gere instantaneamente uma senha aleatória e segura</h3>
        </div>

        <div class="conteudo-senha">
            <div class="campo-senha-wrapper">
                <label for="campo-senha">Senha</label>
                <input name="senha" type="text" id="campo-senha" readonly placeholder="Clique em gerar senha">
            </div>
            <button type="button" class="botao-copiar" id="btn-copiar">Copiar</button>
        </div>

        <div class="parametro">
            <h3 class="parametro-titulo">Personalize sua senha</h3>
            <div class="parametro-coluna__senha">
                <div class="parametro-senha">
                    <h4 class="parametro-senha__titulo">Número de caracteres</h4>
                    <div class="parametro-senha-botoes">
                        <button type="button" class="parametro-senha__botao" id="btn-diminuir">-</button>
                        <p class="parametro-senha__texto" id="comprimento-texto">12</p>
                        <button type="button" class="parametro-senha__botao" id="btn-aumentar">+</button>
                    </div>
                </div>

                <div class="parametro-senha">
                    <h4 class="parametro-senha__titulo">Características da senha</h4>
                    <div class="caracteristicas">
                        <label><input type="checkbox" id="check-maiusculas" checked> Letras maiúsculas</label>
                        <label><input type="checkbox" id="check-minusculas" checked> Letras minúsculas</label>
                        <label><input type="checkbox" id="check-numeros" checked> Números</label>
                        <label><input type="checkbox" id="check-simbolos" checked> Símbolos</label>
                    </div>
                </div>

                <div class="parametro-senha">
                    <h4 class="parametro-senha__titulo">Força da senha</h4>
                    <div class="forca-container">
                        <div class="forca-barra" id="barra-forca"></div>
                    </div>
                    <p class="forca-texto" id="forca-texto">Média</p>
                </div>
            </div>

            <button type="button" class="botao-gerar" id="btn-gerar">Gerar senha</button>
        </div>
    </section>

    <script src="main.js"></script>
</body>

</html>
